name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [client, partners]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - if: matrix.app == 'partners'
        run: npm ci --prefix ../client
      - run: npm run lint
      - run: npm run build
        env:
          # CI-only URLs let Vite validate builds without deployment settings or secrets.
          VITE_API_URL: https://api.example.invalid
          VITE_PARTNERS_URL: https://partners.example.invalid
          VITE_STOREFRONT_URL: https://shop.example.invalid

  server:
    name: server dependencies and syntax
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: find . -path './node_modules' -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check
